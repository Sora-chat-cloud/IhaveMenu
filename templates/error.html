<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกิดข้อผิดพลาด - IhaveMenu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; }
        .bg-food {
            background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.5)),
                url('https://images.unsplash.com/photo-1498837167922-ddd27525d352?auto=format&fit=crop&w=1920&q=80');
            background-size: cover; background-position: center; background-attachment: fixed;
        }
    </style>
</head>
<body class="bg-gray-900">
    <div class="bg-food min-h-screen flex items-center justify-center px-4">
        <div class="max-w-md w-full bg-white/10 backdrop-blur-xl rounded-3xl shadow-2xl border border-white/20 p-8 text-center transition-all">
            
            <div class="inline-flex items-center justify-center w-20 h-20 bg-red-500/20 rounded-full mb-6">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-red-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
            </div>

            <h1 class="text-3xl font-bold text-white mb-4">อุ๊ปส์! เกิดข้อผิดพลาด</h1>
            <p class="text-gray-300 mb-6 leading-relaxed">
                ดูเหมือนว่าจะติดขัดบางอย่าง <br> 
                โปรดลองใหม่อีกครั้งในภายหลัง
            </p>

            {% if error_message %}
            <div class="bg-black/30 rounded-xl p-3 mb-8 text-xs text-red-300/70 font-mono break-words">
                Detail: {{ error_message }}
            </div>
            {% endif %}

            <div class="flex flex-col gap-3">
                <a href="/user-input" class="w-full bg-yellow-500 hover:bg-yellow-600 text-gray-900 font-bold py-3 rounded-full transition transform hover:scale-105 shadow-lg">
                    ลองเลือกเมนูใหม่อีกครั้ง
                </a>
                <a href="/" class="text-white/60 hover:text-white text-sm transition underline underline-offset-4">
                    กลับหน้าหลัก
                </a>
            </div>
        </div>
    </div>
</body>
</html>
