<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IhaveMenu - ระบบช่วยคิดเมนูอาหารอัจฉริยะ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; overflow-x: hidden; }
        
        .bg-food {
            background-image: linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.4)), 
                            url('https://images.unsplash.com/photo-1498837167922-ddd27525d352?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .text-glow {
            text-shadow: 0 2px 15px rgba(0, 0, 0, 0.9);
        }

        @keyframes revealUp {
            0% { opacity: 0; transform: translateY(30px); filter: blur(10px); }
            100% { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        .animate-reveal { opacity: 0; animation: revealUp 1s cubic-bezier(0.19, 1, 0.22, 1) forwards; }
        .delay-1 { animation-delay: 0.2s; }
        .delay-2 { animation-delay: 0.4s; }
        .delay-3 { animation-delay: 0.6s; }

        /* ปรับขนาดตัวอักษรให้ Auto ตามขนาดหน้าจอ (Fluid Typography) */
        .fluid-h1 {
            font-size: clamp(3rem, 15vw, 8rem);
        }
    </style>
</head>
<body class="bg-black">

    <div class="bg-food min-h-screen flex items-center justify-center p-6 md:p-12">
        <div class="max-w-6xl w-full text-center">
            
            <h1 class="animate-reveal fluid-h1 font-extrabold mb-4 md:mb-8 tracking-tighter text-yellow-400 drop-shadow-2xl text-glow leading-tight">
                IhaveMenu <span class="inline-block animate-bounce text-[0.8em]">🍳</span>
            </h1>
            
            <div class="animate-reveal delay-1 inline-block px-6 py-6 md:px-12 md:py-10 rounded-[2rem] backdrop-blur-md bg-black/40 mb-10 border border-white/20 shadow-2xl w-full max-w-4xl">
                <p class="text-xl sm:text-2xl md:text-4xl text-white leading-relaxed font-light">
                    เปลี่ยนวัตถุดิบในตู้เย็นให้เป็นเมนูสุดพิเศษ <br class="hidden sm:block">
                    ด้วยระบบช่วยคิดเมนูอาหารอัจฉริยะ <br class="sm:hidden">
                    <span class="font-semibold text-yellow-400 border-b-2 border-yellow-400/50">จากวัตถุดิบที่คุณมี</span>
                </p>
            </div>
            
            <div class="animate-reveal delay-2 flex justify-center mb-16">
                <a href="{{ url_for('user_input_page') }}" 
                   class="group relative bg-gradient-to-r from-yellow-400 via-orange-500 to-yellow-500 hover:shadow-[0_0_30px_rgba(245,158,11,0.5)] text-white font-bold py-5 px-12 md:py-6 md:px-20 rounded-full text-2xl md:text-3xl transition-all duration-300 transform hover:scale-105 active:scale-95 shadow-2xl flex items-center gap-3">
                    มาเริ่มกันเลย 
                    <span class="transition-transform duration-300 group-hover:rotate-12">👨‍🍳</span>
                </a>
            </div>

            <div class="animate-reveal delay-3 grid grid-cols-1 sm:grid-cols-3 gap-4 md:gap-8 max-w-5xl mx-auto text-white">
                <div class="flex flex-col items-center group bg-white/10 p-5 md:p-8 rounded-3xl backdrop-blur-md border border-white/10 hover:bg-white/20 transition-all">
                    <div class="text-5xl md:text-6xl mb-3 transition-transform duration-500 group-hover:scale-110 drop-shadow-lg">🥦</div>
                    <p class="text-lg md:text-xl font-medium group-hover:text-yellow-300 transition-colors">เลือกวัตถุดิบได้เอง</p>
                </div>
                
                <div class="flex flex-col items-center group bg-white/10 p-5 md:p-8 rounded-3xl backdrop-blur-md border border-white/10 hover:bg-white/20 transition-all">
                    <div class="text-5xl md:text-6xl mb-3 transition-transform duration-500 group-hover:scale-110 drop-shadow-lg">💡</div>
                    <p class="text-lg md:text-xl font-medium group-hover:text-yellow-300 transition-colors">แนะนำแม่นยำ</p>
                </div>

                <div class="flex flex-col items-center group bg-white/10 p-5 md:p-8 rounded-3xl backdrop-blur-md border border-white/10 hover:bg-white/20 transition-all">
                    <div class="text-5xl md:text-6xl mb-3 transition-transform duration-500 group-hover:scale-110 drop-shadow-lg">✨</div>
                    <p class="text-lg md:text-xl font-medium group-hover:text-yellow-300 transition-colors">ประหยัดเวลา</p>
                </div>
            </div>
            
        </div>
    </div>

</body>
</html>
