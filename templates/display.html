<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecipeFinder - Results</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background: linear-gradient(135deg, #FFF5F0 0%, #FDFBF9 100%);
            min-height: 100vh;
            color: #333;
        }

        .recipe-shadow {
            box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.04);
        }

        .orange-gradient {
            background: linear-gradient(135deg, #F28749 0%, #E67635 100%);
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(-10px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-dropdown {
            animation: fadeInScale 0.2s ease-out forwards;
        }

        .animate-fade {
            animation: fadeIn 0.4s ease-out forwards;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // --- Component: Header ---
        const Header = ({ onEditProfile, onGoHome, onGoFavorites, userImage, username, favoriteCount }) => {
            const [showMenu, setShowMenu] = useState(false);

            return (
                <nav className="sticky top-0 z-50 bg-white border-b border-gray-50 px-6 py-4 shadow-[0_2px_15px_rgba(0,0,0,0.02)]">
                    <div className="max-w-7xl mx-auto flex items-center justify-between">
                        <div className="flex items-center gap-4">
                            <button onClick={() => window.history.back()} className="p-2 hover:bg-gray-50 rounded-full transition-colors text-slate-600">
                                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2.5">
                                    <path strokeLinecap="round" strokeLinejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
                                </svg>
                            </button>
                            <div onClick={() => window.location.href = '/'} className="flex items-center gap-2 cursor-pointer">
                                <div className="w-9 h-9 orange-gradient rounded-xl flex items-center justify-center shadow-orange-200 shadow-lg">
                                    <span className="text-white text-lg">🍳</span>
                                </div>
                                <span className="text-xl font-bold text-gray-800 tracking-tight hidden sm:block">
                                    IHave<span className="text-[#F28749]">Menu</span>
                                </span>
                            </div>
                        </div>
                    </div>
                </nav>
            );
        };

        // --- Component: RecipeCard ---
        const RecipeCard = ({ recipe, isLiked, onToggleLike }) => {
            return (
                <div className="bg-white rounded-[40px] recipe-shadow border border-gray-50 p-6 mb-8 flex flex-col md:flex-row gap-8 relative overflow-hidden animate-fade">
                    <div className="relative shrink-0">
                        <img src={recipe.image} className="w-full md:w-[320px] h-[260px] object-cover rounded-[30px]" />
                        <div className="absolute top-4 left-4 bg-orange-50/40 px-4 py-1.5 rounded-full text-xs font-bold shadow-lg text-white font-bold">{recipe.type.toUpperCase()}</div>
                        <div className="flex justify-between items-center mb-6">
                            <div className="flex gap-4">
                                <div className="gap-3 my-6 text-center bg-orange-50/40 px-4 py-2 rounded-full text-sm border border-gray-100 absolute bottom-15 left-4">
                                    <p className="text-[10px] text-gray-400 font-bold uppercase">เวลา</p>
                                    <p className="text-sm font-semibold text-gray-700">🕒 {recipe.time} นาที </p>
                                </div>
                                <div className="w-px h-8 bg-gray-100"></div>
                                <div className="gap-3 my-6 text-center bg-orange-50/40 px-4 py-2 rounded-full text-sm border border-gray-100 absolute bottom-15 left-32">
                                    <p className="text-[10px] text-gray-400 font-bold uppercase">พลังงาน</p>
                                    <p className="text-sm font-semibold text-gray-700">🔥 {recipe.kcal} kcal</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div className="flex-1 flex flex-col">
                        <div className="flex justify-between items-start">
                            <div>
                                <h2 className="text-2xl font-bold text-gray-800 leading-tight">{recipe.title}</h2>
                                <p className="text-gray-400 text-sm mt-1">{recipe.description}</p>
                            </div>
                            <button onClick={() => onToggleLike(recipe)} className={`w-11 h-11 flex items-center justify-center rounded-full border transition-all ${isLiked ? 'bg-red-50 border-red-100 text-red-500 scale-110 shadow-sm' : 'bg-white border-gray-100 text-gray-300'}`}>
                                <svg viewBox="0 0 24 24" fill={isLiked ? "currentColor" : "none"} stroke="currentColor" strokeWidth="2.5" className="w-6 h-6"><path d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z" /></svg>
                            </button>
                        </div>
                        <div className="grid grid-cols-3 gap-3 my-6">
                            {[{ l: 'โปรตีน', v: recipe.protein, c: 'blue' }, { l: 'คาร์บ', v: recipe.carb, c: 'orange' }, { l: 'ไขมัน', v: recipe.fat, c: 'green' }].map(n => (
                                <div key={n.l} className={`bg-${n.c}-50/40 border border-${n.c}-100/30 p-3 rounded-3xl flex flex-col items-center`}>
                                    <span className={`text-${n.c}-500 text-[10px] font-bold uppercase`}>{n.l}</span>
                                    <div className="flex items-baseline gap-0.5"><span className={`font-bold text-lg text-${n.c}-900`}>{n.v}</span><span className={`text-[10px] text-${n.c}-400 font-bold`}>g</span></div>
                                </div>
                            ))}
                        </div>
                        <div className="space-y-3 mb-6 bg-gray-50/40 p-4 rounded-[25px] border border-gray-100/50">
                            <h4 className="font-bold text-gray-700 flex items-center gap-2 text-sm italic"><span className="text-orange-400">⋮⋮</span> วิธีทำ</h4>
                            {recipe.steps.map((step, idx) => (
                                <div key={idx} className="flex gap-3 text-[13px] text-gray-500 leading-snug">
                                    <span className="bg-orange-500 text-white w-5 h-5 rounded-full flex items-center justify-center text-[10px] shrink-0 font-bold mt-0.5">{idx + 1}</span>
                                    <p>{step}</p>
                                </div>
                            ))}
                        </div>
                        <div className="mt-auto flex gap-3">
                            <button onClick={() => onToggleLike(recipe)} className={`flex-1 py-3.5 rounded-[22px] font-bold text-sm transition-all shadow-lg flex items-center justify-center gap-2 ${isLiked ? 'bg-gray-100 text-gray-500' : 'orange-gradient text-white shadow-orange-100'}`}>
                                {isLiked ? "❌ ยกเลิกการบันทึก" : "📖 บันทึกเมนูนี้"}
                            </button>
                            <button className="w-12 h-12 bg-white border border-gray-100 rounded-[22px] flex items-center justify-center text-gray-400 hover:text-gray-600 shadow-sm transition-all">
                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" /></svg>
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- Component: Main ResultPage ---
        const ResultPage = () => {
            const [currentPage, setCurrentPage] = useState('results');
            const [userProfileImage, setUserProfileImage] = useState(null);
            const [username, setUsername] = useState('Username');
            const [favorites, setFavorites] = useState([]);
            const [recipes, setRecipes] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState("");


            // State สำหรับเก็บ Tags ที่ดึงมาจาก LocalStorage
            const [displayTags, setDisplayTags] = useState([]);

            // --- ปรับปรุง useEffect ให้แข็งแรงขึ้น ---
            React.useEffect(() => {
                const savedSettings = localStorage.getItem('userSettings');

                if (savedSettings) {
                    try {
                        const settings = JSON.parse(savedSettings);
                        const tags = [];

                        // 1. ตรวจสอบเวลา (Time)
                        if (settings.time) {
                            tags.push({
                                l: `${settings.time}`,
                                i: '🕒',
                                c: 'bg-red-50 text-red-500'
                            });
                        }

                        // 2. ตรวจสอบสไตล์อาหาร (Styles) - รองรับทั้ง Array และ String
                        const styleConfig = {
                            'Thai': { label: 'อาหารไทย', emoji: '🍲', color: 'bg-orange-50 text-orange-500' },
                            'Clean': { label: 'อาหารคลีน', emoji: '🥗', color: 'bg-green-50 text-green-600' },
                            'Western': { label: 'อาหารฝรั่ง', emoji: '🍝', color: 'bg-yellow-50 text-yellow-700' },
                            'Keto': { label: 'คีโต', emoji: '🥩', color: 'bg-red-50 text-red-700' },
                            'Japanese': { label: 'อาหารญี่ปุ่น', emoji: '🍣', color: 'bg-pink-50 text-pink-600' }
                        };

                        if (Array.isArray(settings.styles)) {
                            settings.styles.forEach(style => {
                                const config = styleConfig[style] || { label: style, emoji: '🍱', color: 'bg-orange-50 text-orange-500' };
                                tags.push({ l: config.label, i: config.emoji, c: config.color });
                            });
                        }

                        // 3. ตรวจสอบอุปกรณ์ (Appliances)
                        const applianceConfig = {
                            'เตาแก๊ส': { emoji: '🔥', color: 'bg-cyan-50 text-cyan-600' },
                            'หม้อทอดไร้น้ำมัน': { emoji: '🍟', color: 'bg-yellow-50 text-yellow-600' },
                            'ไมโครเวฟ': { emoji: '⏲️', color: 'bg-purple-50 text-purple-600' },
                            'เตาอบ': { emoji: '🍞', color: 'bg-blue-50 text-blue-600' },
                            'หม้อหุงข้าว': { emoji: '🍚', color: 'bg-green-50 text-green-600' },
                            'เครื่องปั่น': { emoji: '🥤', color: 'bg-purple-50 text-purple-600' }
                        };

                        if (Array.isArray(settings.appliances)) {
                            settings.appliances.forEach(app => {
                                const config = applianceConfig[app] || { emoji: '🍴', color: 'bg-gray-50 text-gray-600' };
                                tags.push({ l: app, i: config.emoji, c: config.color });
                            });
                        }

                        setDisplayTags(tags);
                    } catch (e) {
                        console.error("Error parsing settings:", e);
                    }
                }
            }, []);

            React.useEffect(() => {
                setLoading(true);
                setError("");

                const settings = JSON.parse(localStorage.getItem("userSettings") || "{}");

                fetch("/api/generate", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        settings: settings
                    })
                })
                    .then(res => {
                        if (!res.ok) throw new Error("API error");
                        return res.json();
                    })
                    .then(data => {
                        setRecipes(Array.isArray(data.recipes) ? data.recipes : []);
                    })
                    .catch(err => {
                        console.error(err);
                        setError("ไม่สามารถโหลดเมนูจาก AI ได้");
                    })
                    .finally(() => {
                        setLoading(false);
                    });

            }, []);


            // ฟังก์ชันจัดการการกดถูกใจ (Like/Unlike)
            const handleToggleLike = (recipe) => {
                setFavorites(prev => {
                    const isAlreadyLiked = prev.some(item => item.id === recipe.id);
                    if (isAlreadyLiked) {
                        return prev.filter(item => item.id !== recipe.id);
                    } else {
                        return [...prev, recipe];
                    }
                });
            };

            const handleSaveProfile = (data) => {
                setUsername(data.username);
                setUserProfileImage(data.image);
            };

            // Render หน้า Favorites
            const renderFavoritesPage = () => (
                <div className="animate-fade">
                    <div className="mb-8">
                        <h1 className="text-3xl font-bold text-gray-800">เมนูที่บันทึกไว้ ({favorites.length})</h1>
                        <p className="text-gray-400">รายการอาหารที่คุณกดถูกใจไว้ทั้งหมด</p>
                    </div>
                    {favorites.length === 0 ? (
                        <div className="text-center py-20 bg-white rounded-[40px] recipe-shadow border border-gray-100">
                            <span className="text-5xl block mb-4">🍳</span>
                            <p className="text-gray-400">ยังไม่มีเมนูที่บันทึกไว้เลย ลองไปหาเมนูที่ชอบดูนะ!</p>
                            <button onClick={() => setCurrentPage('results')} className="mt-4 text-orange-500 font-bold hover:underline">ไปหน้าค้นหา</button>
                        </div>
                    ) : (
                        favorites.map(r => (
                            <RecipeCard
                                key={r.id}
                                recipe={r}
                                isLiked={true}
                                onToggleLike={handleToggleLike}
                            />
                        ))
                    )}
                </div>
            );

            return (
                <div className="min-h-screen flex flex-col">
                    <Header
                        onEditProfile={() => setCurrentPage('editProfile')}
                        onGoHome={() => setCurrentPage('results')}
                        onGoFavorites={() => setCurrentPage('favorites')}
                        userImage={userProfileImage}
                        username={username}
                        favoriteCount={favorites.length}
                    />

                    <main className="flex-1 max-w-5xl mx-auto px-4 py-12 w-full">
                        {currentPage === 'editProfile' ? (
                            <EditProfilePage
                                currentImage={userProfileImage}
                                currentUsername={username}
                                onSaveProfile={handleSaveProfile}
                                onCancel={() => setCurrentPage('results')}
                            />
                        ) : currentPage === 'favorites' ? (
                            renderFavoritesPage()
                        ) : (
                            <>
                                <div className="flex flex-col items-center mb-10 animate-fade">
                                    <div className="w-14 h-14 bg-green-100 text-green-500 rounded-full flex items-center justify-center mb-6 text-2xl shadow-sm">✓</div>
                                    <h1 className="text-4xl font-bold text-gray-800 text-center">เจอแล้ว! <span className="text-[#F28749]">3 เมนู</span>ที่เหมาะกับคุณ</h1>
                                    <p className="text-gray-400 mt-2 text-center">เลือกเมนูที่ชอบและเริ่มทำอาหารได้เลย</p>
                                </div>


                                <div className="flex justify-center gap-3 mb-12 flex-wrap animate-fade">
                                    {displayTags.length > 0 ? (
                                        displayTags.map((tag, index) => (
                                            <span key={index} className={`${tag.c} px-4 py-2 rounded-full text-[11px] font-bold shadow-sm border border-white flex items-center gap-1.5 transition-all hover:scale-105`}>
                                                {tag.i} {tag.l}
                                            </span>
                                        ))
                                    ) : (
                                        <span className="text-gray-400 text-sm italic">ไม่ได้เลือกเงื่อนไขเพิ่มเติม</span>
                                    )}
                                </div>

                                {loading && (
                                    <div className="text-center py-20 text-gray-400 animate-fade">
                                        🤖 AI กำลังคิดเมนูให้คุณ...
                                    </div>
                                )}

                                {error && (
                                    <div className="text-center py-20 text-red-500 animate-fade">
                                        {error}
                                    </div>
                                )}

                                {!loading && !error && (
                                    <div className="space-y-4">
                                        {recipes.map((r) => (
                                            <RecipeCard
                                                key={r.id}
                                                recipe={r}
                                                isLiked={favorites.some(fav => fav.id === r.id)}
                                                onToggleLike={handleToggleLike}
                                            />
                                        ))}
                                    </div>
                                )}

                                <div className="bg-[#EBF5FF] border border-blue-100 rounded-[30px] p-8 mt-12 mb-12 flex gap-5 items-start">
                                    <div className="bg-blue-500 text-white w-8 h-8 rounded-full flex items-center justify-center shrink-0 font-bold text-sm italic shadow-md">i</div>
                                    <div>
                                        <h5 className="font-bold text-blue-900 text-sm mb-2">เกี่ยวกับการคำนวณแคลอรี่</h5>
                                        <p className="text-xs text-blue-700/80 leading-relaxed font-light">
                                            ระบบใช้ความสามารถของ AI ในการวิเคราะห์สัดส่วนวัตถุดิบที่ใช้ เพื่อประมาณการแคลอรี่ออกมาเป็นค่าโดยประมาณ (Estimated Calories) พร้อมทั้งแยกสัดส่วนโปรตีน คาร์โบไฮเดรต และไขมัน เพื่อช่วยให้ผู้ใช้ควบคุมอาหารและวางแผนโภชนาการได้สะดวกขึ้น
                                        </p>
                                    </div>
                                </div>
                                <div className="flex flex-col md:flex-row justify-center gap-4 pt-4 border-t border-gray-100">
                                    <button onClick={() =>window.location.reload()} className="px-10 py-3.5 bg-white border border-gray-100 rounded-[22px] text-sm font-bold text-gray-500 hover:bg-gray-50 flex items-center justify-center gap-2 transition-all">
                                        <span>🔄</span> ลองเมนูใหม่อีกครั้ง
                                    </button>
                                    <button onClick={() => window.location.href = '/'} className="px-10 py-3.5 orange-gradient rounded-[22px] text-sm font-bold text-white hover:opacity-90 shadow-lg shadow-orange-100 flex items-center justify-center gap-2 transition-all">
                                        <span>🏠</span> กลับหน้าหลัก
                                    </button>
                                </div>
                            </>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ResultPage />);
    </script>
</body>

</html>
