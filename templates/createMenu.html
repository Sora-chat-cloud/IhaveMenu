<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เมนูแนะนำสำหรับคุณ - IhaveMenu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Kanit', sans-serif;
            overflow-x: hidden;
        }

        .bg-food {
            background-image: linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.4)),
                url('https://images.unsplash.com/photo-1498837167922-ddd27525d352?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .text-glow {
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .glass-panel:hover {
            transform: translateY(-5px);
        }

        @keyframes revealUp {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-reveal {
            animation: revealUp 0.8s cubic-bezier(0.19, 1, 0.22, 1) forwards;
        }
    </style>
</head>

<body class="bg-gray-100">

    <div class="bg-food min-h-screen p-6 md:p-12">
        <div class="max-w-6xl mx-auto">

            <div class="animate-reveal flex justify-between items-center mb-10">
                <a href="/user-input"
                    class="text-white drop-shadow-lg hover:text-yellow-400 transition flex items-center gap-2 font-semibold">
                    <span class="text-2xl">←</span> กลับไปแก้ไขวัตถุดิบ
                </a>
            </div>

            <div class="flex flex-wrap justify-center gap-8 w-full">
                {% for item in menus %}
                <div class="animate-reveal glass-panel rounded-[2.5rem] overflow-hidden flex flex-col 
                flex-grow flex-shrink-0 basis-full 
                md:basis-[calc(50%-2rem)] 
                lg:basis-[calc(33.33%-2rem)] 
                max-w-[800px]" style="animation-delay: {{ loop.index0 * 0.2 }}s">

                    <div class="h-64 md:h-72 lg:h-80 w-full relative overflow-hidden">
                        <img src="{{ item.Image_url }}" alt="{{ item.recipe_name }}"
                            class="w-full h-full object-cover transition-transform duration-500 hover:scale-110">
                        <div
                            class="absolute top-4 right-4 bg-yellow-400 text-black px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-widest shadow-lg">
                            Menu {{ loop.index }}
                        </div>
                    </div>

                    <div class="p-5 md:p-6 flex flex-col">
                        <h2 class="text-2xl md:text-3xl font-bold text-slate-800 mb-3 border-b border-slate-200 pb-2">
                            {{ item.recipe_name }}
                        </h2>

                        <div class="grid grid-cols-2 gap-3 mb-4">
                            <div class="bg-white/40 backdrop-blur-md p-3 rounded-2xl text-center border border-white">
                                <p class="text-[10px] text-slate-500 uppercase font-bold tracking-widest">Calories</p>
                                <p class="text-xl font-bold text-slate-800">{{ item.nutrition[0].calories }} <span
                                        class="text-[10px] font-normal text-orange-500">kcal</span></p>
                            </div>
                            <div class="bg-white/40 backdrop-blur-md p-3 rounded-2xl text-center border border-white">
                                <p class="text-[10px] text-slate-500 uppercase font-bold tracking-widest">Protein</p>
                                <p class="text-xl font-bold text-slate-800">{{ item.nutrition[0].protein }} <span
                                        class="text-[10px] font-normal text-orange-500">g</span></p>
                            </div>
                        </div>

                        <div>
                            <p class="text-slate-600 font-light leading-snug text-base md:text-lg">
                                {{ item.instruction }}
                            </p>
                        </div>
                    </div>
                </div>
                {% endfor %}
            </div>

            <div class="animate-reveal [animation-delay:0.8s] mt-12 flex justify-center">
                <a href="/"
                    class="bg-white/90 hover:bg-white text-slate-800 font-bold py-4 px-16 rounded-full text-xl shadow-xl transition-all duration-300 transform hover:scale-105">
                    กลับหน้าหลัก
                </a>
            </div>

            <p class="text-center mt-12 text-white/60 text-xs tracking-[0.4em] uppercase font-bold drop-shadow-md">
                IhaveMenu Intelligent System • AI Recommended
            </p>

        </div>
    </div>

</body>

</html>
