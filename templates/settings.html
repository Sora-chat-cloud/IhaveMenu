<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตั้งค่าเงื่อนไข - RecipeFinder</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background: linear-gradient(135deg, #FFF5F0 0%, #FDFBF9 100%);
            min-height: 100vh;
        }

        .orange-gradient {
            background: linear-gradient(135deg, #F28749 0%, #E67635 100%);
        }

        ::-webkit-scrollbar {
            display: none;
        }

        .transition-all {
            transition: all 0.3s ease;
        }

        @keyframes dropdown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-dropdown {
            animation: dropdown 0.2s ease-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .animate-fade {
            animation: fadeIn 0.4s ease-in-out;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // --- Component: Header ---
        const Header = ({ onEditProfile, onGoHome, onGoFavorites, userImage, username, favoriteCount }) => {
            const [showMenu, setShowMenu] = useState(false);

            return (
                <nav className="sticky top-0 z-50 bg-white border-b border-gray-50 px-6 py-4 shadow-[0_2px_15px_rgba(0,0,0,0.02)]">
                    <div className="max-w-7xl mx-auto flex items-center justify-between">
                        <div className="flex items-center gap-4">
                            <button onClick={() => window.history.back()} className="p-2 hover:bg-gray-50 rounded-full transition-colors text-slate-600">
                                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2.5">
                                    <path strokeLinecap="round" strokeLinejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
                                </svg>
                            </button>
                            <div onClick={() => window.location.href = '/'} className="flex items-center gap-2 cursor-pointer">
                                <div className="w-9 h-9 orange-gradient rounded-xl flex items-center justify-center shadow-orange-200 shadow-lg">
                                    <span className="text-white text-lg">🍳</span>
                                </div>
                                <span className="text-xl font-bold text-gray-800 tracking-tight hidden sm:block">
                                    IHave<span className="text-[#F28749]">Menu</span>
                                </span>
                            </div>
                        </div>
                    </div>
                </nav>
            );
        };


        // --- Component: MainApp (Filter Page) ---
        const MainApp = ({ selectedTime, setSelectedTime, selectedStyles, setSelectedStyles, selectedAppliances, setSelectedAppliances }) => {

            // 1. เพิ่ม State เพื่อเก็บข้อมูลวัตถุดิบที่รับมา
            const [ingredients, setIngredients] = React.useState([]);

            // 2. ใช้ useEffect ดึงข้อมูลทันทีที่หน้าจอโหลด
            React.useEffect(() => {
                const savedData = localStorage.getItem('selectedIngredients');
                if (savedData) {
                    try {
                        setIngredients(JSON.parse(savedData));
                    } catch (e) {
                        console.error("Error parsing ingredients", e);
                        setIngredients([]);
                    }
                }
            }, []);

            const appliances = [
                { name: 'ไมโครเวฟ', Enname: 'Microwave', icon: '⏲️', color: 'bg-blue-50' },
                { name: 'หม้อทอดไร้น้ำมัน', Enname: 'Air Fryer', icon: '🍟', color: 'bg-orange-50' },
                { name: 'เตาแก๊ส', Enname: 'Gas Stove', icon: '🔥', color: 'bg-red-50' },
                { name: 'เตาอบ', Enname: 'Oven', icon: '🍞', color: 'bg-purple-50' },
                { name: 'หม้อหุงข้าว', Enname: 'Rice Cooker', icon: '🍚', color: 'bg-green-50' },
                { name: 'เครื่องปั่น', Enname: 'Blender', icon: '🥤', color: 'bg-pink-50' }
            ];

            const foodStyles = [
                { id: 'Clean', name: 'Clean', Thname: 'อาหารคลีน', sub: 'อาหารคลีน', icon: '🥗', color: 'bg-green-50' },
                { id: 'Thai', name: 'Thai', Thname: 'อาหารไทย', sub: 'อาหารไทย', icon: '🍲', color: 'bg-orange-50' },
                { id: 'Western', name: 'Western', Thname: 'อาหารฝรั่ง', sub: 'อาหารฝรั่ง', icon: '🍝', color: 'bg-blue-50' },
                { id: 'Keto', name: 'Keto', Thname: 'คีโต', sub: 'คีโต', icon: '🥩', color: 'bg-purple-50' }
            ];

            const toggleItem = (list, setList, item) => {
                setList(list.includes(item) ? list.filter(i => i !== item) : [...list, item]);
            };

            const isReady =
                selectedTime !== "ยังไม่เลือก" &&
                selectedStyles.length > 0 &&
                selectedAppliances.length > 0;

            return (
                <div className="max-w-2xl mx-auto pb-44 px-4 animate-fade">
                    <header className="text-center py-10">
                        <h1 className="text-3xl font-bold text-gray-800">ตั้งค่า<span className="text-orange-500">เงื่อนไข</span></h1>
                        <p className="text-gray-400 text-sm mt-1">ระบุข้อมูลเพิ่มเติมเพื่อให้เราหาเมนูที่ตรงใจคุณที่สุด</p>
                    </header>

                    {/* --- แก้ไข: แสดงข้อมูลวัตถุดิบจากหน้าแรกจริง ๆ --- */}
                    <div className="bg-white rounded-[35px] p-6 shadow-sm border border-gray-50 mb-8">
                        <div className="flex items-center gap-2 mb-4">
                            <span className="bg-orange-100 p-2 rounded-xl">🛒</span>
                            <h3 className="font-bold">วัตถุดิบที่เลือก</h3>
                            <span className="ml-auto bg-orange-400 text-white px-3 py-1 rounded-full text-xs">
                                {ingredients.length} รายการ
                            </span>
                        </div>
                        <div className="flex flex-wrap gap-2">
                            {ingredients.length > 0 ? (
                                ingredients.map((item, index) => (
                                    <span key={index} className="bg-orange-50/40 px-4 py-2 rounded-full text-sm border border-gray-100 text-orange-700">
                                        {item}
                                    </span>
                                ))
                            ) : (
                                <p className="text-gray-400 text-sm italic">ไม่มีวัตถุดิบที่ถูกเลือกมา</p>
                            )}
                        </div>
                    </div>

                    {/* Time Section */}
                    <div className="bg-white rounded-[30px] p-6 mb-6 shadow-sm border border-gray-50">
                        <h3 className="font-bold mb-1 flex items-center gap-2 text-gray-700">🕒 เวลาในการทำอาหาร</h3>
                        <p className="text-gray-400 text-sm mb-4">เลือกเวลาที่คุณต้องการใช้ในการทำอาหาร</p>
                        <div className="grid grid-cols-3 gap-3 mt-4">
                            {[{ t: 'ด่วนมาก', d: 'ไม่เกิน 15 นาที', icon: '🏎️' }, { t: 'ปานกลาง', d: 'ประมาณ 30 นาที', icon: '⏱️' }, { t: 'จัดเต็ม', d: 'ไม่จำกัดเวลา', icon: '🍽️' }].map(item => (
                                <div key={item.t} onClick={() => setSelectedTime(item.t)}
                                    className={`p-4 rounded-[25px] cursor-pointer transition-all border-2 flex flex-col items-center ${selectedTime === item.t ? 'border-orange-400 bg-orange-50/30' : 'border-gray-50 bg-white hover:border-orange-200'}`}>
                                    <div className="text-2xl mb-2">{item.icon}</div>
                                    <div className="text-[11px] font-bold text-gray-700">{item.t}</div>
                                    <div className="text-[9px] text-gray-400">{item.d}</div>
                                    <div className={`w-4 h-4 rounded-full border-2 mt-3 ${selectedTime === item.t ? 'bg-orange-400 border-orange-400' : 'border-gray-200'}`}></div>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* Styles Section */}
                    <div className="bg-white rounded-[30px] p-6 mb-6 shadow-sm border border-gray-100">
                        <h3 className="font-bold mb-1 flex items-center gap-2 text-gray-700">🍲 ประเภทอาหาร</h3>
                        <p className="text-gray-400 text-sm mb-4">เลือกสไตล์อาหารที่คุณชื่นชอบ</p>
                        <div className="grid grid-cols-2 gap-3 mt-4">
                            {foodStyles.map(style => (
                                <div key={style.id} onClick={() => toggleItem(selectedStyles, setSelectedStyles, style.id)}
                                    className={`${style.color} p-4 rounded-[22px] flex items-center justify-between cursor-pointer border-2 transition-all ${selectedStyles.includes(style.id) ? 'border-orange-300 ring-2 ring-orange-50' : 'border-transparent'}`}>
                                    <div className="flex items-center gap-3">
                                        <div className="bg-white w-10 h-10 rounded-xl flex items-center justify-center text-xl shadow-sm">{style.icon}</div>
                                        <div className="text-[11px] font-bold text-gray-700">{style.name}</div>
                                        <div className="text-[9px] text-gray-400 border-l border-gray-200 pl-2">{style.Thname}</div>
                                    </div>
                                    <div className={`w-5 h-5 rounded-md border flex items-center justify-center ${selectedStyles.includes(style.id) ? 'bg-orange-500 border-orange-500' : 'bg-white border-gray-200'}`}>
                                        {selectedStyles.includes(style.id) && <span className="text-white text-[10px]">✓</span>}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* Appliances Section */}
                    <div className="bg-white rounded-[30px] p-6 shadow-sm border border-gray-100 mb-6">
                        <h3 className="font-bold mb-1 flex items-center gap-2 text-gray-700">🍳 เครื่องครัวที่มี</h3>
                        <p className="text-gray-400 text-sm mb-4">เลือกเครื่องครัวที่คุณมีใช้งานอยู่</p>
                        <div className="grid grid-cols-2 gap-3 mt-4">
                            {appliances.map(app => (
                                <div key={app.name} onClick={() => toggleItem(selectedAppliances, setSelectedAppliances, app.name)}
                                    className={`${app.color} p-4 rounded-[22px] flex items-center justify-between cursor-pointer border-2 transition-all ${selectedAppliances.includes(app.name) ? 'border-orange-400 ring-2 ring-orange-50' : 'border-transparent'}`}>
                                    <div className="flex items-center gap-3">
                                        <div className="bg-white w-10 h-10 rounded-xl flex items-center justify-center text-xl shadow-sm">{app.icon}</div>
                                        <div className="text-[11px] font-bold text-gray-700">{app.name}</div>
                                        <div className="text-[9px] text-gray-400 border-l border-gray-200 pl-2">{app.Enname}</div>
                                    </div>
                                    <div className={`w-5 h-5 rounded-md border flex items-center justify-center ${selectedAppliances.includes(app.name) ? 'bg-orange-500 border-orange-500' : 'bg-white border-gray-200'}`}>
                                        {selectedAppliances.includes(app.name) && <span className="text-white text-[10px]">✓</span>}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* Sticky Bottom Button */}
                    <div className="fixed bottom-0 left-0 right-0 p-6 bg-white/90 backdrop-blur-md border-t border-gray-100 flex flex-col items-center z-50">
                        <div className="mb-4 text-gray-500 text-[10px] font-semibold flex gap-3 bg-gray-50 px-4 py-1.5 rounded-full border border-gray-100">
                            <span className={selectedTime !== "ยังไม่เลือก" ? "text-orange-600 font-bold" : ""}>🕒 {selectedTime}</span>
                            <span className="text-gray-300">•</span>
                            <span className={selectedStyles.length > 0 ? "text-orange-600 font-bold" : ""}>🍛 {selectedStyles.length} สไตล์</span>
                            <span className="text-gray-300">•</span>
                            <span className={selectedAppliances.length > 0 ? "text-orange-600 font-bold" : ""}>⚙️ {selectedAppliances.length} เครื่องครัว</span>
                        </div>

                        <button
                            disabled={!isReady}
                            onClick={async () => {

                                const payload = {
                                    time: selectedTime,
                                    styles: selectedStyles,
                                    appliances: selectedAppliances,
                                    ingredients: ingredients   // วัตถุดิบที่ดึงมาจาก localStorage แล้ว
                                };

                                try {
                                    const res = await fetch('/api/settings', {
                                        method: 'POST',
                                        headers: {
                                            'Content-Type': 'application/json'
                                        },
                                        body: JSON.stringify(payload)
                                    });

                                    const result = await res.json();

                                    if (result.status === 'success') {
                                        window.location.href = '/display';
                                    } else {
                                        alert('ไม่สามารถบันทึกการตั้งค่าได้');
                                    }

                                } catch (err) {
                                    console.error(err);
                                    alert('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้');
                                }
                            }}
                            className={`w-full max-w-md py-4 rounded-2xl font-bold shadow-lg transition-all active:scale-95 
        ${isReady
                                    ? 'orange-gradient text-white cursor-pointer opacity-100'
                                    : 'bg-gray-200 text-gray-400 cursor-not-allowed opacity-60 shadow-none'
                                }`}
                        >
                            {isReady ? '✨ เริ่มเสกเมนู →' : '💡 เลือกเงื่อนไขให้ครบก่อนเริ่ม'}
                        </button>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [user, setUser] = useState({ username: 'Username', userImage: null });
            const [view, setView] = useState('home');
            const [selectedTime, setSelectedTime] = useState("ยังไม่เลือก");
            const [selectedStyles, setSelectedStyles] = useState([]);
            const [selectedAppliances, setSelectedAppliances] = useState([]);

            return (
                <div className="min-h-screen">
                    <Header
                        username={user.username}
                        userImage={user.userImage}
                        onEditProfile={() => setView('profile')}
                        onGoHome={() => setView('home')}
                    />

                    {view === 'home' ? (
                        <MainApp
                            selectedTime={selectedTime} setSelectedTime={setSelectedTime}
                            selectedStyles={selectedStyles} setSelectedStyles={setSelectedStyles}
                            selectedAppliances={selectedAppliances} setSelectedAppliances={setSelectedAppliances}
                        />
                    ) : (
                        <EditProfilePage
                            currentImage={user.userImage}
                            currentUsername={user.username}
                            onCancel={() => setView('home')}
                            onSaveProfile={(img, name) => setUser({ username: name, userImage: img })}
                        />
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
