<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เลือกเมนู - IhaveMenu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Kanit', sans-serif;
        }

        .bg-food {
            background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.6)),
                url('https://images.unsplash.com/photo-1498837167922-ddd27525d352?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* การ์ดที่ถูกเลือก: ปรับขอบให้เรืองแสงสีเหลืองทอง */
        .selected-card {
            border: 3px solid #fbbf24 !important;
            background: rgba(251, 191, 36, 0.15) !important;
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.4);
        }

        /* ตกแต่ง Scrollbar ให้เข้ากับธีม */
        .scrollbar-thin::-webkit-scrollbar {
            width: 6px;
        }

        .scrollbar-thin::-webkit-scrollbar-thumb {
            background: rgba(251, 191, 36, 0.5);
            border-radius: 10px;
        }
    </style>
</head>

<body class="bg-gray-900">
    <div class="bg-food min-h-screen flex items-center justify-center px-4 py-8">
        <div class="max-w-5xl w-full">
            <a href="/"
                class="inline-flex items-center gap-2 text-white hover:text-yellow-400 transition mb-6 drop-shadow-md">
                <span class="text-2xl">←</span> <span class="text-lg font-semibold">กลับหน้าแรก</span>
            </a>

            <h1 class="text-4xl md:text-5xl font-bold text-white text-center mb-10 tracking-tight drop-shadow-lg">
                เลือกเมนูที่ <span class="text-yellow-400">อยากกิน</span> 🍳
            </h1>

            <div
                class="bg-white/10 backdrop-blur-xl rounded-3xl shadow-2xl border border-white/20 p-6 md:p-10 transition-all duration-500">
                <form action="/pre-ingredients" method="POST" id="menuForm" class="space-y-10">

                    <div>
                        <div class="grid grid-cols-4 gap-3" id="categorySelector">
                            <button type="button" onclick="filterCategory('ต้ม')"
                                class="cat-btn py-3 rounded-xl border-2 border-yellow-500 text-yellow-400 font-bold hover:bg-yellow-500 hover:text-white transition shadow-lg backdrop-blur-sm">ต้ม</button>
                            <button type="button" onclick="filterCategory('ผัด')"
                                class="cat-btn py-3 rounded-xl border-2 border-yellow-500 text-yellow-400 font-bold hover:bg-yellow-500 hover:text-white transition shadow-lg backdrop-blur-sm">ผัด</button>
                            <button type="button" onclick="filterCategory('แกง')"
                                class="cat-btn py-3 rounded-xl border-2 border-yellow-500 text-yellow-400 font-bold hover:bg-yellow-500 hover:text-white transition shadow-lg backdrop-blur-sm">แกง</button>
                            <button type="button" onclick="filterCategory('ทอด')"
                                class="cat-btn py-3 rounded-xl border-2 border-yellow-500 text-yellow-400 font-bold hover:bg-yellow-500 hover:text-white transition shadow-lg backdrop-blur-sm">ทอด</button>
                        </div>
                    </div>

                    <div id="menuSection" class="hidden space-y-6">
                        <div class="flex justify-between items-center border-l-4 border-yellow-500 pl-4">
                            <p class="font-semibold text-white tracking-wide text-lg">เมนูแนะนำ:</p>
                            <p
                                class="text-sm text-yellow-400 font-medium bg-black/30 px-4 py-1.5 rounded-full border border-white/10 shadow-inner">
                                เลือกไว้แล้ว: <span id="selectCount" class="font-bold text-lg">0</span> เมนู
                            </p>
                        </div>

                        <div id="menuGrid"
                            class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 p-2 overflow-y-auto scrollbar-thin"
                            style="max-height: 500px;">
                        </div>
                    </div>

                    <input type="hidden" name="selected_menus_data" id="selectedMenusData">
                    <button type="submit" id="submitBtn"
                        class="hidden ml-auto w-full max-w-xs bg-yellow-500 hover:bg-yellow-600 text-gray-900 font-bold py-3.5 rounded-full text-lg md:text-xl transition transform hover:scale-105 shadow-[0_10px_30px_rgba(234,179,8,0.4)] flex items-center justify-center gap-2">
                        ไปจัดการวัตถุดิบต่อ ➡️
                    </button>

                </form>
            </div>
        </div>
    </div>

    <script>
        const allMenus = {{ menu_json | safe }};
        let selectedMenus = [];

        function filterCategory(cat) {
            document.querySelectorAll('.cat-btn').forEach(btn => {
                const isActive = btn.innerText === cat;
                btn.classList.toggle('bg-yellow-500', isActive);
                btn.classList.toggle('text-gray-900', isActive);
                btn.classList.toggle('text-yellow-400', !isActive);
            });

            const filtered = allMenus.filter(m => m.Category === cat);
            renderMenuCards(filtered);
            document.getElementById('menuSection').classList.remove('hidden');

            // เลื่อนลงมาดูเมนูอัตโนมัติ
            document.getElementById('menuSection').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function renderMenuCards(menus) {
            const grid = document.getElementById('menuGrid');
            grid.innerHTML = menus.map(menu => {
                const isSelected = selectedMenus.some(sm => sm.name === menu.name);
                return `
        <div id="card-${menu.name.replace(/\s+/g, '')}" 
            onclick="toggleMenuSelection(${JSON.stringify(menu).replace(/"/g, '&quot;')})" 
            class="group cursor-pointer bg-white border border-gray-200 rounded-2xl overflow-hidden hover:border-yellow-400 transition-all duration-300 flex flex-col shadow-md ${isSelected ? 'selected-card' : ''}">
            
            <div class="relative overflow-hidden h-32 md:h-36">
                <img src="${menu.Image_url}" class="w-full h-full object-cover transform group-hover:scale-110 transition duration-500" alt="${menu.name}">
                
                <div class="absolute top-2 right-2 bg-yellow-500 rounded-full p-1.5 shadow-lg opacity-0 transition-opacity ${isSelected ? 'opacity-100' : 'group-hover:opacity-40'}">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-900" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
                    </svg>
                </div>
            </div>

            <div class="p-3 text-center flex-grow flex items-center justify-center bg-white">
                <p class="font-semibold text-sm md:text-base text-gray-800 leading-tight group-hover:text-yellow-600 transition">
                    ${menu.name}
                </p>
            </div>
        </div>`;
            }).join('');
        }

        function toggleMenuSelection(menu) {
            const index = selectedMenus.findIndex(sm => sm.name === menu.name);
            const cardId = `card-${menu.name.replace(/\s+/g, '')}`;
            const cardElement = document.getElementById(cardId);

            if (index === -1) {
                selectedMenus.push(menu);
                if (cardElement) cardElement.classList.add('selected-card');
            } else {
                selectedMenus.splice(index, 1);
                if (cardElement) cardElement.classList.remove('selected-card');
            }

            document.getElementById('selectCount').innerText = selectedMenus.length;
            document.getElementById('selectedMenusData').value = JSON.stringify(selectedMenus);

            const submitBtn = document.getElementById('submitBtn');
            if (selectedMenus.length > 0) {
                submitBtn.classList.remove('hidden');
            } else {
                submitBtn.classList.add('hidden');
            }
        }

        document.getElementById('menuForm').onsubmit = function () {
            if (selectedMenus.length === 0) {
                alert("กรุณาเลือกอย่างน้อย 1 เมนูครับ");
                return false;
            }
            return true;
        };
    </script>
</body>

</html>
